[package]
name = "sighticle-cli"
version = "0.1.0"
edition = "2021"
description = "Headless CLI for Sighticle (no Tauri/WebView)"
license = "MIT"

[[bin]]
name = "sighticle"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = { version = "0.9", features = ["wgc"] }
image = "0.25"
arboard = "3"
base64 = "0.22"
chrono = "0.4"
cpal = "0.18"
hound = "3"
ureq = { version = "2", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_SystemInformation",
  "Wdk_System_SystemServices",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
