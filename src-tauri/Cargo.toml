[package]
name = "sightreel"
version = "0.1.0"
description = "轻量级截图 / 录屏工具"
authors = ["sightreel contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sightreel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# 生产模式开关（Tauri 标准特性，DO NOT REMOVE）：
# 启用后二进制按 frontendDist 加载打包进来的 dist/；
# 关闭则按 devUrl 连本地 vite（localhost:1420）。
# 设为默认，使直接 `cargo build/run` 也不会去连未启动的 vite（否则覆盖层
# 会显示"无法访问此页面"错误页）。`pnpm tauri dev` 自带 --no-default-features
# 关闭它，因此开发模式仍走 vite 热更新。
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# xcap 必须开启 wgc 特性：默认走 DXGI Desktop Duplication，而它的录制实现会起一条
# **永不退出**的线程并长期持有 IDXGIOutputDuplication；DXGI 规定每个输出在进程内
# 只能存在一个 duplication，于是第二次录制必然报 E_INVALIDARG(参数错误)。
# 换成 WGC（Windows.Graphics.Capture）后，stop 时会真正 Close 会话与帧池，可反复启停。
xcap = { version = "0.9", features = ["wgc"] }
image = "0.25"
arboard = "3"
base64 = "0.22"
chrono = "0.4"
cpal = "0.18"
hound = "3"
# 字幕识别用的轻量 HTTP 客户端（同步 API + rustls，跑在后台线程，不占异步运行时）
ureq = { version = "2", features = ["json"] }
# 只用于强杀保险丝：GetAsyncKeyState 轮询（见 lib.rs::spawn_kill_watchdog）。
# 版本与 tauri/wry 已依赖的 0.61 对齐，避免多编译一份。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Foundation",
    "Win32_System_Console",
    # 采集排除（SetWindowDisplayAffinity，见 lib.rs::exclude_from_capture）
    "Win32_UI_WindowsAndMessaging",
    # 指针绘制（GetCursorInfo / DrawIconEx / DIB，见 cursor.rs）
    "Win32_Graphics_Gdi",
    # 合成等待（DwmFlush，见 lib.rs::wait_for_composition）
    "Win32_Graphics_Dwm",
    # 系统 build 号判定（RtlGetVersion + OSVERSIONINFOW，决定能否启用采集排除）
    "Win32_System_SystemInformation",
    "Wdk_System_SystemServices",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
